[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "projectpermit"
version = "0.1.0"
description = "Evidence-linked municipal construction permit preflight engine and MCP server."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
x402 = ["x402[fastapi,evm]"]
buyer = ["x402[httpx,evm]", "eth-account>=0.13,<1"]
dev = ["pytest>=8,<9", "jsonschema>=4.23,<5"]

[project.scripts]
projectpermit-api = "projectpermit.cli:run_api"
projectpermit-mcp = "projectpermit.mcp_server:main"
projectpermit-source-watch = "projectpermit.source_watch:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
