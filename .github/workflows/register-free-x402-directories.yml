name: Register Free x402 Directories

on:
  push:
    branches: [main]
    paths:
      - src/projectpermit/openapi_discovery.py
      - src/projectpermit/public_x402_manifest.py
      - scripts/register_free_x402_directories.py
      - .github/workflows/register-free-x402-directories.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install 'httpx>=0.27,<1'
      - name: Validate production manifest and register only with zero-cost directories
        run: python scripts/register_free_x402_directories.py --execute
