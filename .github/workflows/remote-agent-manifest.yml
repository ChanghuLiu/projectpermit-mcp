name: Remote Agent Manifest

on:
  push:
    branches: [main]
    paths:
      - 'src/projectpermit/public_agent_manifest.py'
      - 'src/projectpermit/public_x402_manifest.py'
      - 'src/projectpermit/openapi_discovery.py'
      - 'scripts/agent_manifest_remote_smoke.py'
      - '.github/workflows/remote-agent-manifest.yml'
  pull_request:
    paths:
      - 'src/projectpermit/public_agent_manifest.py'
      - 'src/projectpermit/public_x402_manifest.py'
      - 'src/projectpermit/openapi_discovery.py'
      - 'scripts/agent_manifest_remote_smoke.py'
      - '.github/workflows/remote-agent-manifest.yml'
  workflow_dispatch:

jobs:
  remote-agent-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m py_compile scripts/agent_manifest_remote_smoke.py
      - name: Verify production agent.json with retry
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python scripts/agent_manifest_remote_smoke.py; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 3))
          done
