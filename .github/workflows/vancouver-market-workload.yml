name: Vancouver Market Workload

on:
  workflow_dispatch:
  push:
    paths:
      - 'market_research/vancouver_contractor_permit_workload.py'
      - 'market_research/vancouver_foi_subtrade_schema.py'
      - '.github/workflows/vancouver-market-workload.yml'

permissions:
  contents: read

jobs:
  building-permit-workload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Aggregate public building-permit workload without emitting identities
        run: python market_research/vancouver_contractor_permit_workload.py --output vancouver_contractor_permit_workload_2024.json
      - uses: actions/upload-artifact@v4
        with:
          name: vancouver-contractor-permit-workload-2024
          path: vancouver_contractor_permit_workload_2024.json
          if-no-files-found: error

  foi-subtrade-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install 'openpyxl>=3.1,<4'
      - name: Probe only workbook sheets and column headers
        run: python market_research/vancouver_foi_subtrade_schema.py --output vancouver_foi_schema.json
      - uses: actions/upload-artifact@v4
        with:
          name: vancouver-foi-subtrade-schema
          path: vancouver_foi_schema.json
          if-no-files-found: error
