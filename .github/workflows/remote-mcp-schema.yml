name: Remote MCP Schema Quality

on:
  pull_request:
    paths:
      - scripts/mcp_schema_remote_probe.py
      - .github/workflows/remote-mcp-schema.yml
  push:
    branches: [main]
    paths:
      - src/projectpermit/mcp_input_models.py
      - src/projectpermit/mcp_server.py
      - src/projectpermit/paid_mcp_server.py
      - scripts/mcp_schema_remote_probe.py
      - .github/workflows/remote-mcp-schema.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install MCP client
        run: pip install -e '.[mcp]'
      - name: Inspect production tools/list with deployment retry
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if python scripts/mcp_schema_remote_probe.py; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
