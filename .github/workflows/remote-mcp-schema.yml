name: Remote MCP Schema Quality

on:
  pull_request:
    paths:
      - scripts/mcp_schema_remote_probe.py
      - .github/workflows/remote-mcp-schema.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install MCP client
        run: pip install -e '.[mcp]'
      - name: Inspect production tools/list only
        run: python scripts/mcp_schema_remote_probe.py
