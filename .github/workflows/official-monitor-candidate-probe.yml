name: Official Monitor Candidate Probe

on:
  pull_request:
    paths:
      - scripts/official_monitor_candidate_probe.py
      - .github/workflows/official-monitor-candidate-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install HTTP client
        run: pip install 'httpx>=0.27,<1'
      - name: Probe public official candidate URLs once
        run: python scripts/official_monitor_candidate_probe.py
