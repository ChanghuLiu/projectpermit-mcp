name: UK Taxi x402 paid buyer smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/taxi-paid-buyer-smoke.yml'

permissions:
  contents: read

jobs:
  paid-smoke:
    runs-on: ubuntu-latest
    env:
      EVM_PRIVATE_KEY: ${{ secrets.EVM_PRIVATE_KEY }}
      TAXI_MCP_URL: https://uk-taxi-phv-mcp-production-6ef3.up.railway.app/mcp
    steps:
      - uses: actions/checkout@v4
      - name: Check existing buyer secret without exposing it
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${EVM_PRIVATE_KEY:-}" ]; then
            echo 'PROJECTPERMIT_EVM_PRIVATE_KEY_SECRET_PRESENT=false'
            exit 2
          fi
          echo 'PROJECTPERMIT_EVM_PRIVATE_KEY_SECRET_PRESENT=true'
      - name: Install buyer dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install 'mcp>=2,<3' 'x402[evm]==2.21.0' 'eth-account>=0.13' 'httpx>=0.28,<1'
      - name: Pay and call UK Taxi preflight on Base Sepolia
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio, json, os
          from typing import Any
          from eth_account import Account
          from mcp import ClientSession
          from mcp.client.streamable_http import streamable_http_client
          from x402 import x402ClientSync
          from x402.mechanisms.evm import EthAccountSigner
          from x402.mechanisms.evm.exact.register import register_exact_evm_client
          from x402.mcp import MCPToolResult, x402MCPClient

          URL = os.environ['TAXI_MCP_URL']
          ARGS = {'payload': {'authority': 'City of Bradford Metropolitan District Council', 'age': 30, 'driving_licence_years': 4, 'has_pass_plus_certificate': True}}

          class Adapter:
              def __init__(self, session): self._session = session
              async def connect(self, transport: Any) -> None: pass
              async def close(self) -> None: pass
              async def list_tools(self): return await self._session.list_tools()
              async def call_tool(self, params: dict[str, Any], **kwargs: Any):
                  r = await self._session.call_tool(name=params.get('name',''), arguments=params.get('arguments',{}) or {}, meta=params.get('_meta'))
                  content=[]
                  for item in r.content:
                      if hasattr(item,'text'): content.append({'type':'text','text':item.text})
                      else: content.append({'type':getattr(item,'type','text'),'text':str(item)})
                  meta = r.meta.model_dump(by_alias=True, exclude_none=True) if hasattr(r.meta,'model_dump') else dict(r.meta or {})
                  return MCPToolResult(content=content, is_error=r.is_error, meta=meta, structured_content=r.structured_content)

          async def main():
              account = Account.from_key(os.environ['EVM_PRIVATE_KEY'])
              print('payer=' + account.address)
              client = x402ClientSync()
              register_exact_evm_client(client, EthAccountSigner(account))
              async with streamable_http_client(URL) as (read_stream, write_stream):
                  async with ClientSession(read_stream, write_stream) as session:
                      await session.initialize()
                      def approve(ctx):
                          opt = ctx.payment_required.accepts[0]
                          print(f'payment_required amount={opt.amount} network={opt.network} pay_to={opt.pay_to}')
                          if opt.network != 'eip155:84532' or str(opt.amount) != '20000':
                              raise RuntimeError('unexpected payment requirement')
                          return True
                      paid = x402MCPClient(Adapter(session), client, auto_payment=True, on_payment_requested=approve)
                      result = await paid.call_tool('taxi_licence_preflight', ARGS)
                      print('payment_made=' + str(result.payment_made).lower())
                      print('is_error=' + str(result.is_error).lower())
                      text='\n'.join(i.get('text','') if isinstance(i,dict) else str(i) for i in result.content)
                      if result.payment_response:
                          print('settlement_success=' + str(result.payment_response.success).lower())
                          print('settlement_network=' + str(result.payment_response.network))
                          print('settlement_transaction=' + str(result.payment_response.transaction))
                      if result.is_error or not result.payment_made:
                          raise RuntimeError('paid tool call failed')
                      if 'City of Bradford Metropolitan District Council' not in text or 'VERIFIED' not in text:
                          raise RuntimeError('expected verified Bradford decision not returned')
                      print('UK_TAXI_X402_REAL_PAID_BUYER_SMOKE=PASS')
          asyncio.run(main())
          PY
