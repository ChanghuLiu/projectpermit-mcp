name: CI

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'STATUS.md'
      - 'submission/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'STATUS.md'
      - 'submission/**'

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: python -m compileall -q src

  optional-integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[mcp,x402]'
      - run: python -c "from projectpermit.mcp_server import build_server; print(type(build_server()).__name__)"
      - run: PROJECTPERMIT_X402_ENABLED=false python -c "from projectpermit.api import app; print(app.title)"
      - run: PYTHONPATH=src python tests/x402_wire_smoke.py
      - run: PYTHONPATH=src python tests/x402_mcp_v2_receipt_smoke.py

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t projectpermit:ci .
      - run: docker run -d --rm --name projectpermit-ci -e PORT=8765 -p 8765:8765 projectpermit:ci
      - run: |
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/health; then exit 0; fi
            sleep 1
          done
          docker logs projectpermit-ci
          exit 1

  remote-mcp-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[mcp]'
      - run: python scripts/mcp_remote_smoke.py

  remote-http-preview-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - run: python scripts/http_preview_remote_smoke.py

  remote-paid-mcp-challenge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[mcp]'
      - run: python scripts/paid_mcp_unpaid_smoke.py

  remote-http-bazaar-challenge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[x402]'
      - run: python scripts/http_bazaar_unpaid_smoke.py

  facilitator-capabilities:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - run: python scripts/facilitator_capability_probe.py
      - name: Record current ProjectPermit Bazaar state
        run: |
          set +e
          python scripts/projectpermit_bazaar_lookup.py
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "ProjectPermit is cataloged."
          elif [ "$code" -eq 2 ]; then
            echo "ProjectPermit is not cataloged on the current facilitator."
          else
            exit "$code"
          fi
