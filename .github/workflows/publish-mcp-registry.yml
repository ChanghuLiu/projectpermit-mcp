name: Publish MCP Registry

on:
  push:
    branches: [main]
    paths:
      - server.json
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pinned MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error "$url" -o /tmp/mcp-publisher.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  /tmp/mcp-publisher.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
          chmod +x /tmp/mcp-publisher
          /tmp/mcp-publisher --help >/dev/null

      - name: Authenticate with GitHub OIDC
        run: /tmp/mcp-publisher login github-oidc

      - name: Publish remote server metadata
        run: /tmp/mcp-publisher publish ./server.json

      - name: Verify registry listing
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.ChanghuLiu/projectpermit" \
            -o /tmp/registry.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/registry.json').read_text())
          expected_name = 'io.github.ChanghuLiu/projectpermit'
          expected_version = '0.4.1'
          matches = []
          for item in payload.get('servers', []):
              server = item.get('server', item)
              if server.get('name') == expected_name and server.get('version') == expected_version:
                  matches.append(server)
          if not matches:
              raise SystemExit(f'Registry listing not found: {expected_name} {expected_version}')
          print(f'mcp_registry_listing=PASS name={expected_name} version={expected_version}')
          PY
